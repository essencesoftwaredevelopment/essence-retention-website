          - button "How do you work with our in-house team or other contractors?" [ref=e253]:
            - generic [ref=e254]: How do you work with our in-house team or other contractors?
            - img [ref=e255]
          - paragraph [ref=e257]: Clean collaboration, no stepping on toes. We can plug into your existing ecosystem (designer, media buyer, brand team) and handle retention end-to-end while coordinating on creative priorities and promo schedule.
