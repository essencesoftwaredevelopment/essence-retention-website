    - generic [ref=e159]:
      - heading "Frequently Asked Questions" [level=2] [ref=e160]
      - generic [ref=e161]:
        - generic [ref=e162]:
          - button "What ROI do you typically generate for brands at our level?" [ref=e163]:
            - generic [ref=e164]: What ROI do you typically generate for brands at our level?
            - img [ref=e165]
          - paragraph [ref=e167]: Most brands see a meaningful lift within the first 30 to 60 days. Typical outcomes range from +15% to +40% increase in email/SMS attributed revenue, depending on current setup quality, traffic volume, and inventory depth. If you're already sending, we focus on improving profitability and consistency, not just volume.
        - generic [ref=e168]:
          - button "How do you improve what we've already built without starting over?" [ref=e169]:
            - generic [ref=e170]: How do you improve what we've already built without starting over?
            - img [ref=e171]
          - paragraph [ref=e173]: We don't nuke accounts. We audit what exists, keep what's working, and rebuild only what's limiting results (messaging, segmentation, structure, timing, deliverability). You keep your existing data, list, flows, learnings, and brand voice, we simply make the system perform at a higher level.
        - generic [ref=e174]:
          - button "We already have flows, what else can you add or optimize?" [ref=e175]:
            - generic [ref=e176]: We already have flows, what else can you add or optimize?
            - img [ref=e177]
          - paragraph [ref=e179]:
            - text: "If flows exist, we upgrade them into a real retention engine:"
            - text: • Better segmentation and conditional logic
            - text: • Higher-converting copy and creative
            - text: • Offer positioning without constant discounting
            - text: • Improved timing, split paths, and exclusions
            - text: • Advanced flows most brands don't have (replenishment, VIP, churn prevention, cross-sell, etc.)
        - generic [ref=e180]:
          - button "Do you work with brands doing 7+ figures and above?" [ref=e181]:
            - generic [ref=e182]: Do you work with brands doing 7+ figures and above?
            - img [ref=e183]
          - paragraph [ref=e185]: Yes. We typically work with Shopify brands doing $50k to $1M/month, and also support brands well above 7 figures if there's enough complexity to justify a premium retention partner.
        - generic [ref=e186]:
          - button "How do you segment advanced audiences for better performance?" [ref=e187]:
            - generic [ref=e188]: How do you segment advanced audiences for better performance?
            - img [ref=e189]
          - paragraph [ref=e191]:
            - text: "We build segmentation around:"
            - text: • Purchase behavior (frequency, recency, AOV, product)
            - text: • Engagement levels (opens/clicks, site activity)
            - text: • Lifecycle stages (new, active, at-risk, lapsed, VIP)
            - text: • Offer sensitivity (discount buyer vs. full price buyer)
            - text: This increases revenue while reducing fatigue.
        - generic [ref=e192]:
          - button "Will this actually increase LTV, or just send more emails?" [ref=e193]:
            - generic [ref=e194]: Will this actually increase LTV, or just send more emails?
            - img [ref=e195]
          - paragraph [ref=e197]: We're not here to "send more." We're here to increase repeat purchase rate, retention, and lifetime value. More volume without strategy kills deliverability. We prioritize quality, relevance, and customer lifecycle.
        - generic [ref=e198]:
          - button "How do you avoid list fatigue and unsubscribes?" [ref=e199]:
            - generic [ref=e200]: How do you avoid list fatigue and unsubscribes?
            - img [ref=e201]
          - paragraph [ref=e203]:
            - text: "We protect your list aggressively:"
            - text: • Engagement-based sending (throttling unengaged users)
            - text: • Smart frequency caps
            - text: • Strong "value-first" campaign mix
            - text: • Deliverability monitoring
            - text: • Segmentation that prevents over-mailing
        - generic [ref=e204]:
          - button "Can you match our brand voice and tone consistently?" [ref=e205]:
            - generic [ref=e206]: Can you match our brand voice and tone consistently?
            - img [ref=e207]
          - paragraph [ref=e209]: "Yes. We run a structured tone-matching process: we analyze your site, ads, socials, customer reviews, and existing emails, then build a consistent messaging style guide. Every email follows that voice so the brand stays coherent."
        - generic [ref=e210]:
          - button "How do you use data to decide what campaigns to send?" [ref=e211]:
            - generic [ref=e212]: How do you use data to decide what campaigns to send?
            - img [ref=e213]
          - paragraph [ref=e215]:
            - text: "We don't guess. Campaign planning is based on:"
            - text: • Shopify product performance + margin
            - text: • Cohort behavior (repeat timing + product rebuys)
            - text: • Flow gaps and customer lifecycle needs
            - text: • Klaviyo reporting (what actually drives conversions)
            - text: • Seasonality, launches, and inventory priorities
        - generic [ref=e216]:
          - button "Can you audit our current setup before making recommendations?" [ref=e217]:
            - generic [ref=e218]: Can you audit our current setup before making recommendations?
            - img [ref=e219]
          - paragraph [ref=e221]:
            - text: "Yes. Every partnership starts with a full audit:"
            - text: • Flows and campaigns
            - text: • Tracking + event setup
            - text: • Popups / list growth
            - text: • Segmentation
            - text: • Deliverability
            - text: • Creative and conversion structure
            - text: You'll get a clear roadmap before execution starts.
        - generic [ref=e222]:
          - button "What does your reporting look like, can we track performance clearly?" [ref=e223]:
            - generic [ref=e224]: What does your reporting look like, can we track performance clearly?
            - img [ref=e225]
          - paragraph [ref=e227]:
            - text: "Yes. We provide clear reporting that ties actions to results:"
            - text: • Email + SMS revenue (accounting for attribution nuance)
            - text: • Campaign vs. flow split
            - text: • Revenue per recipient
            - text: • Deliverability and list health
            - text: • Weekly/monthly highlights + next actions
        - generic [ref=e228]:
          - button "How do you ensure deliverability stays high at our list size?" [ref=e229]:
            - generic [ref=e230]: How do you ensure deliverability stays high at our list size?
            - img [ref=e231]
          - paragraph [ref=e233]:
            - text: "Deliverability is part of the system:"
            - text: • Proper DNS setup (SPF/DKIM/DMARC + dedicated sending domain)
